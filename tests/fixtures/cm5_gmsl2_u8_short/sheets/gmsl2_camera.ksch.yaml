  L3:
    lib: Device:L
    value: 47uH
    footprint: Inductor_SMD:L_1210_3225Metric
    fields:
      Design Note: 'PoC bias-T, single broadband choke (2026-06-29). Camera (Waveshare GMSL-2MP-Camera-A,
        MAX96717F) draws <200mA@12V, fused 500mA (F3). History: original 0.47/6.8/22/100uH discrete ladder
        was unbuildable (no in-stock PoC-rated parts) AND ordered backwards (largest at coax); re-staggered
        2026-06-28 to a 5-stage ADL3225V ladder; |Z| modelling (scripts/poc_zmodel.py) then showed the
        multi-stage ladder was heavily over-margined vs the 50ohm coax. Collapsed to a SINGLE ADL3225V,
        which is exactly the part TDK markets as a one-component broadband PoC choke (high |Z| from ~MHz
        into GHz via an engineered high SRF -- replaces a discrete choke ladder). L4 = 47uH (C435260,
        300mA Isat, 0.9ohm) directly from CAM_12V_FUSED to the coax center; R32 (5.1k) damps the |Z| peak
        across it. 1210, AEC-Q200. Modelled series |Z| 295ohm@1MHz -> 591@2MHz -> 3.0kohm@10MHz (inductive
        region exact; GHz coverage is the ADL3225V published broadband |Z|, not the lumped model). DCR
        0.9ohm -> 0.18V drop at 200mA; 300mA Isat carries the 200mA load and saturates only in a >300mA
        fault the 500mA fuse already bounds. Footprint 1210 -> PCB re-lay needed (was a 5-stage 0603/0805/1210
        mix). The 47uH has the lowest SRF of the family, so if the GMSL2 forward rate sits at the top
        of the band, add a 4.7uH (C531415) high-SRF stage in series at the coax (2-stage). CONFIRM broadband
        |Z| vs TDK ADL3225V |Z|-f curve before fab.'
      'LCSC Part #': C435260
    connects:
      '1': GMSL2 Camera_CAM_12V_FUSED
      '2': gmsl2_camera_COAX_CENTER
